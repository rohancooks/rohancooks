<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
<style>@font-face{font-family:S;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:S;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:S,'Segoe UI',Helvetica,Arial,sans-serif}
.up{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes d1{to{transform:translate(-140px,70px) scale(1.15)}}
@keyframes d2{to{transform:translate(120px,-60px) scale(.9)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(600px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F16B0D"/><stop offset="1" stop-color="#E61416"/></linearGradient>
<radialGradient id="o"><stop offset="0" stop-color="#F16B0D" stop-opacity=".55"/><stop offset="1" stop-color="#F16B0D" stop-opacity="0"/></radialGradient>
<radialGradient id="r"><stop offset="0" stop-color="#E61416" stop-opacity=".5"/><stop offset="1" stop-color="#E61416" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern>
<clipPath id="clip"><rect width="600" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)"><rect width="600" height="300" fill="#070707"/>
<circle cx="560" cy="0" r="300" fill="url(#o)" style="animation:d1 14s ease-in-out infinite alternate"/>
<text x="36" y="54" font-size="15" font-weight="700" fill="url(#g)">03</text>
<text x="70" y="54" font-size="12" font-weight="500" fill="#fff" fill-opacity=".5" letter-spacing="1.8">OPERATIONS · WEB APP</text>
<text x="564" y="56" font-size="20" font-weight="500" fill="#fff" fill-opacity=".45" text-anchor="end">↗</text>
<text x="34" y="116" font-size="34" font-weight="700" fill="#fff" letter-spacing="-.8">Staff Attendance App</text>
<text x="36" y="156" font-size="16.5" font-weight="500" fill="#fff" fill-opacity=".62">Selfie + GPS attendance and daily work tracking</text>
<text x="36" y="182" font-size="16.5" font-weight="500" fill="#fff" fill-opacity=".62">for on-ground hostel staff. Live in production.</text>
<rect x="36.0" y="228" width="65.4" height="29" rx="14.5" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/><text x="49.0" y="244.5" font-size="13" font-weight="500" fill="#fff" fill-opacity="0.75">Next.js</text><rect x="111.4" y="228" width="65.1" height="29" rx="14.5" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/><text x="124.4" y="244.5" font-size="13" font-weight="500" fill="#fff" fill-opacity="0.75">Drizzle</text><rect x="186.5" y="228" width="77.1" height="29" rx="14.5" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/><text x="199.5" y="244.5" font-size="13" font-weight="500" fill="#fff" fill-opacity="0.75">Postgres</text><rect x="273.6" y="228" width="63.6" height="29" rx="14.5" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/><text x="286.6" y="244.5" font-size="13" font-weight="500" fill="#fff" fill-opacity="0.75">Vercel</text></g>
<rect x=".5" y=".5" width="599" height="299" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>