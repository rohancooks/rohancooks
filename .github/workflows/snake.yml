name: snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E61416&color_dots=#ebedf0,#fde0cc,#f9b183,#f47f3a,#E61416
            dist/snake-dark.svg?palette=github-dark&color_snake=#F16B0D&color_dots=#161b22,#4a1a06,#8a2c08,#c84a0b,#F16B0D
      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
