name: snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#67e8f9,#c084fc,#f472b6,#fb923c
            dist/snake-dark.svg?palette=github-dark&color_snake=#facc15&color_dots=#161b22,#22d3ee,#a78bfa,#f472b6,#fb923c
      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
